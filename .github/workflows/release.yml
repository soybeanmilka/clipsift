name: Release

# 打一个 v0.1.0 这样的 tag 就自动编译各平台产物并发 Release。
on:
  push:
    tags: ["v*"]
  # 也可以在 Actions 页面手动触发（只构建不发布，用来验证编译）
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: clipsift

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clipsift-windows-x86_64.zip
            gui: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clipsift-linux-x86_64.tar.gz
            gui: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: clipsift-macos-aarch64.tar.gz
            gui: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin clipsift

      # GUI 目前只发 Windows 版：Linux 上 egui 需要额外的 X11/Wayland 头文件，
      # 而这工具的主要痛点在中文 Windows 环境的复制粘贴。
      - name: Build GUI (Windows only)
        if: matrix.gui
        run: cargo build --release --target ${{ matrix.target }} --bin clipsift-gui

      # ---- 打包：Windows 用 zip，其他用 tar.gz ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：PowerShell 里 `Copy-Item a b dir/` 会被解析成位置参数错误，
          # 必须用 -Path 数组 或者 逐个 Copy-Item。
          $bin = "target/${{ matrix.target }}/release/${{ env.BIN }}.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path $bin -Destination "dist/${{ env.BIN }}.exe"
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ env.BIN }}-gui.exe" -Destination "dist/${{ env.BIN }}-gui.exe"
          Copy-Item -Path @("README.md", "README.en.md", "LICENSE") -Destination dist
          Copy-Item -Path "docs" -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath ${{ matrix.artifact }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" dist/
          cp README.md README.en.md LICENSE dist/
          cp -r docs dist/
          chmod +x "dist/${BIN}"
          tar -czf "${{ matrix.artifact }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 安装

            下载对应平台的文件解压。Windows 包里有两个程序：

            - `clipsift-gui.exe` —— 图形界面，双击就能用（推荐）
            - `clipsift.exe` —— 命令行，放进 `PATH` 即可

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | `clipsift-windows-x86_64.zip` |
            | Linux x64 | `clipsift-linux-x86_64.tar.gz` |
            | macOS Apple Silicon | `clipsift-macos-aarch64.tar.gz` |

            ## 最快上手

            ```bash
            clipsift watch        # 常驻后台，每次复制自动净化
            clipsift --list-rules # 看有哪些规则
            ```

            详见 [README](https://github.com/soybeanmilka/clipsift#readme)。
