name: Release

# 打一个 v0.1.0 这样的 tag 就自动编译各平台产物并发 Release。
on:
  push:
    tags: ["v*"]
  # 也可以在 Actions 页面手动触发（只构建不发布，用来验证编译）
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: clipsift

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clipsift-windows-x86_64.zip
            installer: ClipSift-setup.exe
            gui: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clipsift-linux-x86_64.tar.gz
            gui: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: clipsift-macos-aarch64.tar.gz
            gui: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin clipsift

      # GUI 目前只发 Windows 版：Linux 上 egui 需要额外的 X11/Wayland 头文件，
      # 而这工具的主要痛点在中文 Windows 环境的复制粘贴。
      - name: Build GUI (Windows only)
        if: matrix.gui
        run: cargo build --release --target ${{ matrix.target }} --bin clipsift-gui

      # 安装包用 Inno Setup 编译。runner 上预装过 Inno Setup 6，
      # 但它不在 PATH 里，得按固定路径找。
      - name: Build installer (Windows only)
        if: matrix.gui
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "找不到 Inno Setup 的 ISCC.exe，安装包没编出来"
          }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$ver" "/DSourceDir=..\target\${{ matrix.target }}\release" "installer\clipsift.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败，退出码 $LASTEXITCODE" }
          # 输出是 dist\ClipSift-<ver>-setup.exe，改名成不带版本号的文件名挂到 Release 上：
          # 用户拿到的永久链接不会变，装完看到的产品名和版本号由安装程序自己报。
          $setup = Get-ChildItem "dist\ClipSift-*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "没找到 Inno Setup 的输出文件" }
          Copy-Item $setup.FullName "${{ matrix.installer }}"
          # 从 dist 里挪走：后面的 zip 打包是 dist/*，留着会把安装包塞进免安装包里。
          Remove-Item $setup.FullName -Force

      # ---- 打包：Windows 用 zip，其他用 tar.gz ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：PowerShell 里 `Copy-Item a b dir/` 会被解析成位置参数错误，
          # 必须用 -Path 数组 或者 逐个 Copy-Item。
          $bin = "target/${{ matrix.target }}/release/${{ env.BIN }}.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path $bin -Destination "dist/${{ env.BIN }}.exe"
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ env.BIN }}-gui.exe" -Destination "dist/${{ env.BIN }}-gui.exe"
          Copy-Item -Path @("README.md", "README.en.md", "LICENSE") -Destination dist
          Copy-Item -Path "docs" -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath ${{ matrix.artifact }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" dist/
          cp README.md README.en.md LICENSE dist/
          cp -r docs dist/
          chmod +x "dist/${BIN}"
          tar -czf "${{ matrix.artifact }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.installer }}

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Windows：双击安装（推荐）

            下载 **`ClipSift-setup.exe`** 双击，一路下一步就行。
            装完直接能用，卸载去「设置 → 应用 → 已安装的应用」找 ClipSift。

            - 装到当前用户目录，**不需要管理员权限**，不弹 UAC
            - 安装时可勾选「开机自动启动」「创建桌面快捷方式」
            - 卸载干净：程序文件、开始菜单、桌面图标、自启项一起清掉
            - 卸载时问一句要不要保留你的规则设置

            ## 其他方式

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `clipsift-windows-x86_64.zip` | 免安装版，解压即用 |
            | Linux x64 | `clipsift-linux-x86_64.tar.gz` | 命令行 |
            | macOS Apple Silicon | `clipsift-macos-aarch64.tar.gz` | 命令行 |

            ## 命令行用法

            ```bash
            clipsift watch         # 常驻后台，每次复制自动净化
            clipsift once          # 只净化一次剪贴板
            clipsift --list-rules  # 看有哪些规则
            ```

            详见 [README](https://github.com/soybeanmilka/clipsift#readme)。
