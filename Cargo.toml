[workspace]
resolver = "2"
members = ["crates/clipsift-core", "crates/clipsift-cli", "crates/clipsift-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# GUI 用的 eframe 0.32 要求 1.85，整个 workspace 跟着抬。
# 只影响源码编译（想自己 build 的人），下载预编译 exe 的用户不受限制。
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/soybeanmilka/clipsift"
authors = ["soybeanmilka"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
